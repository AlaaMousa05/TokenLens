name: Deploy TokenLens frontend to Azure

on:
  push:
    branches: [feature/backend-api]

permissions:
  contents: read

concurrency:
  group: azure-gsg-fron-end
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://front-a8efgycrdeh0a8ht.uaenorth-01.azurewebsites.net
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build
          npm run test --if-present

      - name: Package the Next.js server
        working-directory: frontend
        run: |
          cp -R .next/static .next/standalone/.next/
          if [ -d public ]; then
            cp -R public .next/standalone/
          fi
          cd .next/standalone
          npm pkg set 'scripts.start=HOSTNAME=0.0.0.0 node server.js'
          zip -qr "$GITHUB_WORKSPACE/frontend.zip" . -x '.env*' '*/.env*'

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: gsg-fron-end
          package: frontend.zip
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
